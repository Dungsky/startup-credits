    title: 65% off yearly Pro plan for startups
    summary: Eligible startups incorporated under 12 months with under $3M raised and fewer than 25 people get 65% off their first year of Mailazy Pro.
    lifecycle:
      status: active
      effective_from: 2026-01-01T00:00:00.000Z
    economics:
      benefits:
        - benefit_id: ben_01
          description: 65% off the first year of Mailazy Pro ($172 instead of $490 yearly list price)
          duration:
            kind: exact
            value: P1Y
          kind: discount
          percentage:
            basis_points: 6500
            kind: exact
      consideration:
        kind: variable
        description: The startup pays the discounted price of $172 for the first year of Mailazy Pro.
    eligibility:
      rule:
        kind: all
        rules:
          - criterion_id: cri_age
            fact: company.age_months
            kind: predicate
            operator: lt
            statement: The company was incorporated less than 12 months ago.
            value:
              type: number
              value: 12
          - criterion_id: cri_funding
            fact: company.funding_raised_usd
            kind: predicate
            operator: lt
            statement: Under $3M raised in total across all rounds.
            value:
              type: number
              value: 3000000
          - criterion_id: cri_team_size
            kind: manual
            reason: external-verification
            statement: Fewer than 25 people (full-time equivalents, founders included).
          - criterion_id: cri_customer
            fact: company.is_current_customer
            kind: predicate
            operator: eq
            statement: New to paid Mailazy.
            value:
              type: boolean
              value: false
